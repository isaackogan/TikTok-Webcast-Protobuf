name: "Release (Kotlin): Build & Publish to Maven"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be triggered from the main branch, got ${{ github.ref }}"
          exit 1

  release:
    needs: check-branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targets/kotlin/tiktok-live-proto
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(grep -oE '^version = "[^"]+"' build.gradle.kts | sed -E 's/version = "([^"]+)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$NEW\"/" build.gradle.kts
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_REPO_URL: ${{ vars.MAVEN_REPO_URL }}
        run: ./gradlew --no-daemon clean publish

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets/kotlin/tiktok-live-proto/build.gradle.kts
          git commit -m "chore: release kotlin tiktok-live-proto v${{ steps.bump.outputs.version }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase
            if git push; then exit 0; fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 4 + 1))
          done
          exit 1

      - name: Create git tag
        working-directory: ${{ github.workspace }}
        run: |
          git tag "kotlin/v${{ steps.bump.outputs.version }}"
          git push origin "kotlin/v${{ steps.bump.outputs.version }}"

      - name: Summary
        run: echo "### Published io.github.isaackogan.tiktok:tiktok-live-proto:${{ steps.bump.outputs.version }}" >> $GITHUB_STEP_SUMMARY
