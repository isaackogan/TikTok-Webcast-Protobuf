name: Generate Python from Proto

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.proto'
      - 'targets/python/TikTokLiveProto/scripts/**'
      - 'targets/python/TikTokLiveProto/pyproject.toml'
      - '.github/workflows/generate-python.yml'
  workflow_dispatch:

concurrency:
  group: generate-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: targets/python/TikTokLiveProto
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: arduino/setup-protoc@v3
        with:
          version: '34.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install betterproto compiler
        run: python -m pip install "betterproto[compiler]==2.0.0b7"

      - name: Generate Python
        run: python scripts/generate.py

      - name: Check for drift
        id: diff
        run: |
          if git diff --quiet -- src/TikTokLiveProto; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets/python/TikTokLiveProto/src/TikTokLiveProto
          git commit -m "chore(proto): regenerate Python from proto sources

          Source: ${{ github.sha }}"
          git push
