name: "Release (JVM): Build & Publish to Maven Central"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must be triggered from the main branch, got ${{ github.ref }}"
          exit 1

  release:
    needs: check-branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targets/jvm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify generated sources are committed
        run: |
          test -d tiktok-live-proto/src/generated/java
          test -d tiktok-live-proto-kotlin/src/generated/kotlin

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(grep -oE '^version=.*' gradle.properties | sed -E 's/version=//')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac
          sed -i -E "s/^version=.*/version=$NEW/" gradle.properties
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Build and publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./gradlew --no-daemon clean publishAggregationToCentralPortal

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets/jvm/gradle.properties
          git commit -m "chore: release jvm tiktok-live-proto v${{ steps.bump.outputs.version }} [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase
            if git push; then exit 0; fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 4 + 1))
          done
          exit 1

      - name: Create git tag
        working-directory: ${{ github.workspace }}
        run: |
          git tag "jvm/v${{ steps.bump.outputs.version }}"
          git push origin "jvm/v${{ steps.bump.outputs.version }}"

      - name: Summary
        run: |
          echo "### Published com.eulerstream:tiktok-live-proto:${{ steps.bump.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "### Published com.eulerstream:tiktok-live-proto-kotlin:${{ steps.bump.outputs.version }}" >> $GITHUB_STEP_SUMMARY
