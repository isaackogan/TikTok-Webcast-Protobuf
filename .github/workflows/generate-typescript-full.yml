name: Generate TypeScript (Full) from Proto

on:
  push:
    branches: [main]
    paths:
      - 'src/full'
      - 'targets/typescript/tiktok-live-proto-full/scripts/**'
      - 'targets/typescript/tiktok-live-proto-full/package.json'
      - 'targets/typescript/tiktok-live-proto-full-types/scripts/**'
      - 'targets/typescript/tiktok-live-proto-full-types/package.json'
      - '.github/workflows/generate-typescript-full.yml'
  workflow_dispatch:

concurrency:
  group: generate-typescript-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package:
          - tiktok-live-proto-full
          - tiktok-live-proto-full-types
    defaults:
      run:
        working-directory: targets/typescript/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: recursive
          token: ${{ secrets.EULERSTREAM_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - uses: arduino/setup-protoc@v3
        with:
          version: '27.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript
        run: pnpm run generate

      - name: Check for drift
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- src)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets/typescript/${{ matrix.package }}/src
          git commit -m "chore(proto): regenerate ${{ matrix.package }} from proto sources

          Source: ${{ github.sha }}"
          for i in 1 2 3 4 5; do
            git pull --rebase
            if git push; then exit 0; fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 4 + 1))
          done
          exit 1
