name: Generate JVM from Proto

on:
  push:
    branches: [main]
    paths:
      - 'src/slim/**/*.proto'
      - 'targets/jvm/scripts/**'
      - 'targets/jvm/build.gradle.kts'
      - 'targets/jvm/settings.gradle.kts'
      - 'targets/jvm/tiktok-live-proto/build.gradle.kts'
      - 'targets/jvm/tiktok-live-proto-kotlin/build.gradle.kts'
      - 'targets/jvm/gradle/**'
      - '.github/workflows/generate-jvm.yml'
  workflow_dispatch:

concurrency:
  group: generate-jvm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: targets/jvm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Java + Kotlin sources with Wire
        run: ./gradlew --no-daemon -PgenerateProtos :tiktok-live-proto:generateMainProtos :tiktok-live-proto-kotlin:generateMainProtos

      - name: Check for drift
        id: diff
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$(git status --porcelain -- targets/jvm/tiktok-live-proto/src/generated targets/jvm/tiktok-live-proto-kotlin/src/generated)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add targets/jvm/tiktok-live-proto/src/generated targets/jvm/tiktok-live-proto-kotlin/src/generated
          git commit -m "chore(proto): regenerate JVM from proto sources

          Source: ${{ github.sha }}"
          for i in 1 2 3 4 5; do
            git pull --rebase
            if git push; then exit 0; fi
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 4 + 1))
          done
          exit 1
