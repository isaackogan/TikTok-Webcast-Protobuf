syntax = "proto3";

package webcast.envelope.model;

import "webcast/model/base/messages.proto";
import "webcast/model/message/common.proto";

message EnvelopeEnigmaInfo {
  bool is_enigma_mask_on = 1;
}

message EnvelopeGift {
  int64 gift_id = 1;
  int64 gift_price = 2;
  .webcast.model.message.common.Text gift_name = 3;
  .webcast.model.base.ImageModel gift_image = 4;
}

message EnvelopeReward {
  int32 type = 1;
  int64 count = 2;
  int64 gift_id = 4;
  int64 price = 5;
}

message EnvelopeRewardPool {
  repeated EnvelopeReward rewards = 2;
}
